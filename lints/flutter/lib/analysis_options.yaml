include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - avoid_print
    - constant_identifier_names
    - prefer_final_locals
    - prefer_final_in_for_each
    - sort_pub_dependencies
    - require_trailing_commas
    - omit_local_variable_types
    - cancel_subscriptions
    - always_declare_return_types
    - avoid_void_async
    - no_adjacent_strings_in_list
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - avoid_bool_literals_in_conditional_expressions
    - prefer_single_quotes
    - prefer_const_declarations
    - unnecessary_lambdas
    - combinators_ordering
    - noop_primitive_operations
    - unnecessary_null_checks
    - unnecessary_null_in_if_null_operators
    - unnecessary_to_list_in_spreads
    - use_is_even_rather_than_modulo
    - use_super_parameters
    - directives_ordering
    - prefer_relative_imports
    # Flutter specific:
    - use_colored_box

plugins:
  dart_code_linter:
    version: ^4.3.0
    # The analyzer only runs plugin lint rules listed here, so every rule
    # configured under `dart_code_linter.rules` needs an entry. That section
    # still supplies each rule's severity and parameters, and is what the
    # `metrics` CLI reads.
    diagnostics:
      # Dart specific:
      avoid-dynamic: true
      avoid-redundant-async: true
      avoid-unnecessary-type-assertions: true
      avoid-unnecessary-type-casts: true
      avoid-unrelated-type-assertions: true
      no-equal-then-else: true
      prefer-first: true
      prefer-last: true
      prefer-immediate-return: true
      prefer-enums-by-name: true
      avoid-unnecessary-conditionals: true
      prefer-match-file-name: true
      member-ordering: true
      avoid-global-state: true
      avoid-banned-imports: true
      # Flutter specific:
      prefer-media-query-direct-access: true
      avoid-wrapping-in-padding: true
      prefer-correct-edge-insets-constructor: true
      avoid-returning-widgets: true
      prefer-single-widget-per-file: true
      prefer-extracting-callbacks: true
  # riverpod_lint registers its rules as warning rules, which are enabled by
  # default, so it needs no `diagnostics` section.
  riverpod_lint: ^3.1.3

analyzer:
  errors:
    todo: ignore
    use_build_context_synchronously: ignore
  exclude:
    - lib/l10n/*.dart

dart_code_linter:
  rules:
    # Dart specific:
    - avoid-dynamic
    - avoid-redundant-async
    - avoid-unnecessary-type-assertions
    - avoid-unnecessary-type-casts
    - avoid-unrelated-type-assertions
    - no-equal-then-else
    - prefer-first
    - prefer-last
    - prefer-immediate-return
    - prefer-enums-by-name
    - avoid-unnecessary-conditionals
    - prefer-match-file-name
    - member-ordering
    - avoid-global-state
    - avoid-banned-imports:
        entries:
        - paths: ['services/.*\.dart', 'shared/.*\.dart']
          deny: ['features/.*\.dart']
          message: 'Do not import code from features into services or shared!'
    # Flutter specific:
    - prefer-media-query-direct-access
    - avoid-wrapping-in-padding
    - prefer-correct-edge-insets-constructor
    - avoid-returning-widgets
    - prefer-single-widget-per-file:
        ignore-private-widgets: true
    - prefer-extracting-callbacks
